<!DOCTYPE html>
<html lang="pt-BR" class="light scroll-smooth" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>WBM Technology — Apresentação Institucional</title>

    <!-- Theme anti-flash script: respects localStorage 'wbm_theme' with default 'light' -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wbm_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Metadados de SEO e Identidade -->
    <meta name="description" content="A WBM Technology desenvolve e integra soluções de instrumentação, automação e IoT para monitoramento, supervisão e controle de equipamentos e processos industriais." />
    <meta name="author" content="WBM Technology" />
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WBM Technology — Da Informação ao Controle. Do Controle ao Resultado." />
    <meta property="og:description" content="Soluções de instrumentação, automação e IoT para a Indústria 4.0. Conheça nossa apresentação institucional interativa." />
    <meta property="og:image" content="/assets/og-preview.jpg" />
    <meta property="og:image:secure_url" content="/assets/og-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WBM Technology - Apresentação Institucional" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="WBM Technology" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WBM Technology — Apresentação Institucional" />
    <meta name="twitter:description" content="Soluções de instrumentação, automação e IoT para a Indústria 4.0." />
    <meta name="twitter:image" content="/assets/og-preview.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

    <style>
      /* Base styles */
      body {
        background-color: var(--wbm-bg, #E6EFEB);
        color: var(--wbm-text, #172C22);
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      
      /* Custom selection */
      ::selection {
        background-color: #00DF00;
        color: #000000;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #087C3B;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #00DF00;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00DF00;
      }

      /* Neon glow text helper */
      .text-neon-glow {
        text-shadow: 0 0 12px rgba(0, 223, 0, 0.65), 0 0 24px rgba(0, 223, 0, 0.35);
      }
      .box-neon-glow {
        box-shadow: 0 0 20px rgba(0, 223, 0, 0.35), inset 0 0 15px rgba(0, 223, 0, 0.1);
      }
    </style>
  </head>
  <body class="bg-[var(--wbm-bg)] text-[var(--wbm-text)] antialiased selection:bg-[#00DF00] selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
